{% extends 'base.html' %}
{% block title %}Delete Project{% endblock %}
{% block page_title %}Delete Project{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card p-4 text-center">
            <i class="fas fa-exclamation-triangle fa-3x text-danger mb-3"></i>
            <h4>Delete "{{ project.name }}"?</h4>
            <p class="text-muted">This will permanently delete the project and ALL its tasks. This cannot be undone.</p>
            <div class="d-flex gap-2 justify-content-center mt-3">
                <form method="post">{% csrf_token %}<button type="submit" class="btn btn-danger">Yes, Delete</button></form>
                <a href="{% url 'project_detail' project.pk %}" class="btn btn-outline-secondary">Cancel</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
