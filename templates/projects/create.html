{% extends 'base.html' %}
{% block title %}Create Project{% endblock %}
{% block page_title %}Create New Project{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card p-4">
            <form method="post">
                {% csrf_token %}
                <div class="mb-3">
                    <label class="form-label fw-semibold">Project Name <span class="text-danger">*</span></label>
                    <input type="text" name="name" class="form-control form-control-lg" placeholder="Enter project name" required>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Description</label>
                    <textarea name="description" class="form-control" rows="3" placeholder="Project description..."></textarea>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Add Members</label>
                    <div class="border rounded p-3" style="max-height:200px;overflow-y:auto;">
                        {% for u in users %}
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" name="members" value="{{ u.id }}" id="user_{{ u.id }}">
                            <label class="form-check-label" for="user_{{ u.id }}">
                                {{ u.username }} <span class="text-muted small">({{ u.get_role_display }})</span>
                            </label>
                        </div>
                        {% endfor %}
                    </div>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="fas fa-plus me-2"></i>Create Project</button>
                    <a href="{% url 'project_list' %}" class="btn btn-outline-secondary">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
