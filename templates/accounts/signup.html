{% extends 'base.html' %}
{% block title %}Sign Up - Team Task Manager{% endblock %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center py-4" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
    <div class="card p-4" style="width: 480px; border-radius: 16px;">
        <div class="text-center mb-4">
            <div style="font-size: 2rem; color: #e94560;"><i class="fas fa-tasks"></i></div>
            <h3 class="fw-bold mt-2">Create Account</h3>
            <p class="text-muted">Join Team Task Manager</p>
        </div>
        {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            <div class="row">
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">First Name</label>
                    <input type="text" name="first_name" class="form-control" placeholder="First name">
                </div>
                <div class="col-md-6 mb-3">
                    <label class="form-label fw-semibold">Last Name</label>
                    <input type="text" name="last_name" class="form-control" placeholder="Last name">
                </div>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Username <span class="text-danger">*</span></label>
                <input type="text" name="username" class="form-control" placeholder="Choose a username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Email <span class="text-danger">*</span></label>
                <input type="email" name="email" class="form-control" placeholder="your@email.com" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Role</label>
                <select name="role" class="form-select">
                    <option value="member">Member</option>
                    <option value="admin">Admin</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password <span class="text-danger">*</span></label>
                <input type="password" name="password" class="form-control" placeholder="Min 8 characters" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Confirm Password <span class="text-danger">*</span></label>
                <input type="password" name="password2" class="form-control" placeholder="Repeat password" required>
            </div>
            <button type="submit" class="btn btn-lg w-100 mt-1" style="background:#e94560;border-color:#e94560;color:white;">
                <i class="fas fa-user-plus me-2"></i>Create Account
            </button>
        </form>
        <div class="text-center mt-3">
            <p class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-decoration-none fw-semibold" style="color:#e94560;">Login</a></p>
        </div>
    </div>
</div>
{% endblock %}
