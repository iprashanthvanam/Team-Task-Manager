{% extends 'base.html' %}
{% block title %}Login - Team Task Manager{% endblock %}
{% block auth_content %}
<div class="min-vh-100 d-flex align-items-center justify-content-center" style="background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);">
    <div class="card p-4" style="width: 420px; border-radius: 16px;">
        <div class="text-center mb-4">
            <div style="font-size: 2.5rem; color: #e94560;"><i class="fas fa-tasks"></i></div>
            <h3 class="fw-bold mt-2">Team Task Manager</h3>
            <p class="text-muted">Sign in to your account</p>
        </div>
        {% for message in messages %}
        <div class="alert alert-danger">{{ message }}</div>
        {% endfor %}
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label class="form-label fw-semibold">Username</label>
                <input type="text" name="username" class="form-control form-control-lg" placeholder="Enter username" required>
            </div>
            <div class="mb-3">
                <label class="form-label fw-semibold">Password</label>
                <input type="password" name="password" class="form-control form-control-lg" placeholder="Enter password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-lg w-100 mt-2" style="background:#e94560;border-color:#e94560;">
                <i class="fas fa-sign-in-alt me-2"></i>Login
            </button>
        </form>
        <div class="text-center mt-3">
            <p class="text-muted">Don't have an account? <a href="{% url 'signup' %}" class="text-decoration-none fw-semibold" style="color:#e94560;">Sign Up</a></p>
        </div>
    </div>
</div>
{% endblock %}
